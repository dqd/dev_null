###
# Configuration of dev_null, dqd's IRC bot on IRCnet, for Limnoria.
#
# Only the settings that differ from Limnoria's defaults are listed here;
# Limnoria fills in the rest (with their documentation) the first time it
# writes the file back. Paths are relative to the working directory of the
# bot, which is the root of this repository (mounted as /home/bot in Docker).
###

supybot.nick: dev_null
supybot.nick.alternates: dev_zero dev_nil dev_naught dev_one dev_two dev_three
supybot.ident: bot
supybot.user: dqd's lazy bot

###
# Network
###
supybot.networks: ircnet
supybot.networks.ircnet.servers: irc.ircnet.com:6667
supybot.networks.ircnet.channels: #brno #dump #linux.cz #programatori
supybot.networks.ircnet.ssl: False

###
# Directories
###
supybot.directories.conf: conf
supybot.directories.data: data
supybot.directories.data.tmp: data/tmp
supybot.directories.backup: backup
supybot.directories.log: logs
supybot.directories.plugins: plugins

###
# Behaviour
###
supybot.reply.whenNotCommand: False
supybot.reply.error.inPrivate: True
supybot.reply.error.withNotice: True
supybot.reply.whenAddressedBy.chars: @
supybot.drivers.maxReconnectWait: 100.0
supybot.protocols.http.peekSize: 500000

###
